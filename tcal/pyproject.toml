[project]
name            = "tcal"
version         = "2.0.0"
description     = "Taskwarrior GANTT/list TUI"
readme          = "README.md"
requires-python = ">=3.11"

authors = [
  { name = "Grové Steyn", email = "grove.steyn@gmail.com" }
]

dependencies = [
  "textual>=0.60.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev  = ["ruff", "textual-dev"]
test = ["pytest"]

[project.scripts]
tcal = "tcal.__main__:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcal"]
